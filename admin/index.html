<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Cangaço Admin</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="../img/logocangaco.svg" alt="Cangaço">
        <h1>Painel Administrativo</h1>
      </div>

      <form id="login-form" class="auth-form" novalidate>

        <div class="form-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <div class="input-wrapper">
            <i class="fas fa-lock"></i>
            <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
          </div>
        </div>

        <div id="erro-login" class="erro-msg" style="display:none" role="alert"></div>

        <button type="submit" class="btn-login" id="btn-login">
          <span id="btn-text">Entrar</span>
          <i class="fas fa-spinner fa-spin" id="btn-loading" style="display:none"></i>
        </button>

      </form>

      <a href="../index.html" class="voltar-site">
        <i class="fas fa-arrow-left"></i> Voltar ao site
      </a>

    </div>
  </div>

  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Redirect if already authenticated
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = 'dashboard.html';
    });

    const form       = document.getElementById('login-form');
    const erroDiv    = document.getElementById('erro-login');
    const btnLogin   = document.getElementById('btn-login');
    const btnText    = document.getElementById('btn-text');
    const btnLoading = document.getElementById('btn-loading');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      setLoading(true);
      erroDiv.style.display = 'none';

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        window.location.href = 'dashboard.html';
      } catch (err) {
        erroDiv.textContent = mensagemErro(err.code);
        erroDiv.style.display = 'block';
      } finally {
        setLoading(false);
      }
    });

    function setLoading(on) {
      btnLogin.disabled  = on;
      btnText.textContent = on ? 'Entrando...' : 'Entrar';
      btnLoading.style.display = on ? 'inline' : 'none';
    }

    function mensagemErro(code) {
      const mapa = {
        'auth/user-not-found':     'E-mail não cadastrado.',
        'auth/wrong-password':     'Senha incorreta.',
        'auth/invalid-credential': 'E-mail ou senha incorretos.',
        'auth/invalid-email':      'E-mail inválido.',
        'auth/too-many-requests':  'Muitas tentativas. Aguarde e tente novamente.',
        'auth/network-request-failed': 'Sem conexão. Verifique sua internet.',
      };
      return mapa[code] || 'Erro ao fazer login. Tente novamente.';
    }
  </script>

</body>
</html>
